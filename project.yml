name: OdooConnect
options:
  bundleIdPrefix: com.benedict
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: AMX2M7NM59
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "11"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  OdooConnect:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: OdooConnect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benedict.odooconnect
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: OdooConnect/Info.plist
        DEVELOPMENT_LANGUAGE: de
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_CFBundleDisplayName: OdooCompanion
