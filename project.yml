name: OdooConnect
options:
  bundleIdPrefix: com.odooconnect
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  OdooConnect:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: OdooConnect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.odooconnect.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: OdooConnect/Info.plist
        DEVELOPMENT_LANGUAGE: de
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: OdooConnect
        INFOPLIST_KEY_NSCameraUsageDescription: "Used to attach product photos to quotes."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Used to attach images to quotes."
        INFOPLIST_KEY_UIBackgroundModes: "fetch processing"
